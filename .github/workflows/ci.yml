name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Git diff check
        run: git diff --check

      - name: Verify forbidden tracked files
        run: |
          set -e
          echo "Checking for tracked local_* files..."
          LOCAL_FILES=$(git ls-files 'local_*' '**/local_*' || true)
          if [ -n "$LOCAL_FILES" ]; then
            echo "Error: Found tracked local_* files:"
            echo "$LOCAL_FILES"
            exit 1
          fi

          echo "Checking for tracked proprietary JAR files..."
          TRACKED_JARS=$(git ls-files '*.jar' ':!gradle/wrapper/gradle-wrapper.jar' || true)
          if [ -n "$TRACKED_JARS" ]; then
            echo "Error: Found tracked proprietary JAR files:"
            echo "$TRACKED_JARS"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run compilation and test suite with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Verify deployable artifact packaging
        run: |
          set -e
          JAR_FILE="build/libs/Optimizer-0.1.0-SNAPSHOT.jar"
          if [ ! -f "$JAR_FILE" ]; then
            echo "Error: Deployable artifact $JAR_FILE not found!"
            exit 1
          fi

          JAR_ENTRIES=$(unzip -l "$JAR_FILE")

          echo "Checking required entries in $JAR_FILE..."
          echo "$JAR_ENTRIES" | grep -F "kotlin/jvm/internal/Intrinsics.class" || { echo "Missing kotlin/jvm/internal/Intrinsics.class"; exit 1; }
          echo "$JAR_ENTRIES" | grep -F "itzherzchen/optimizer/OptimizerPlugin.class" || { echo "Missing itzherzchen/optimizer/OptimizerPlugin.class"; exit 1; }
          echo "$JAR_ENTRIES" | grep -F "plugin.yml" || { echo "Missing plugin.yml"; exit 1; }
          echo "$JAR_ENTRIES" | grep -F "config.yml" || { echo "Missing config.yml"; exit 1; }

          echo "Verifying absence of vendor implementation classes..."
          if echo "$JAR_ENTRIES" | grep -F "com/bgsoftware/wildtools/"; then
            echo "Error: WildTools implementation classes found in deployable artifact!"
            exit 1
          fi
          if echo "$JAR_ENTRIES" | grep -F "com/bgsoftware/superiorskyblock/"; then
            echo "Error: SuperiorSkyblock2 implementation classes found in deployable artifact!"
            exit 1
          fi
          echo "Artifact packaging verification passed successfully!"

      - name: Generate SHA-256 checksums
        run: |
          set -e
          cd build/libs
          sha256sum Optimizer-0.1.0-SNAPSHOT.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload validated CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-snapshot-artifact
          path: |
            build/libs/Optimizer-0.1.0-SNAPSHOT.jar
            build/libs/SHA256SUMS.txt
          retention-days: 5
          if-no-files-found: error
